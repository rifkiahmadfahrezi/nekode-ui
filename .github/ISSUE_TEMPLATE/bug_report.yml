name: Bug report
description: Something isn't working the way it should.
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please search existing issues to avoid duplicates.

  - type: input
    id: component
    attributes:
      label: Component or utility
      description: Which registry item is affected (e.g. `field-switch`, `date-picker-field`, `date`)?
      placeholder: field-switch
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal steps to reproduce, or a link to a reproduction (CodeSandbox, StackBlitz, a repo).
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Package versions relevant to this bug (component version, React, Next/Vite/etc, browser).
      placeholder: |
        - Installed via: npx shadcn@latest add ...
        - React: 19.x
        - Browser: Chrome 129
    validations:
      required: false
